# V4 — proper 4-fold walk-forward retrain on Spark GB10.
#
# The honest scientific experiment: V2 architecture (mult=0.25 labels,
# triple-barrier neutral threshold), but each fold's train/val/test
# window is recomputed from `bar_close_utc_ns` via
# `compute_fold_boundaries`. The single static `unified["splits"]`
# partition is bypassed so each fold actually sees different time periods.
#
# Same model, same losses, same optimizer. Only the splits change.
# Comparing V4 to V2 isolates "single split vs walk-forward" cleanly.

model:
  # numeric_dim must match unified.pt features (computed at build time).
  # V1 plan target was 681 but the realized feature pipeline shipped 651.
  numeric_dim: 651
  # d_model=192 matches the V1 SSL anchors we warm-start from (Mac mini
  # reduced-scale ckpt). Re-pretraining at 384 from scratch would cost
  # ~4-8h/fold on GB10. d_model=192 keeps SSL transferable + halves
  # activation memory vs 384, which is critical under contention.
  d_model: 192
  # V1 SSL anchor was trained at num_heads=4 (head_dim=48), not 6.
  num_heads: 4
  num_transformer_layers: 10
  num_slstm_layers: 2
  t_bars: 64
  patch_len: 4
  patch_stride: 4
  n_classes: 3
  regime_dim: 12
  d_text: 256
  n_news_slots: 8
  dropout: 0.2
  drop_path_max: 0.2
  decomposition_kernel: 24

dataloader:
  # B=16 measured 30 s/step on Spark GB10 (memory-bandwidth bound).
  # B=8 ran 6 s/step. Stick with B=8 — 5x faster per step even though
  # half the bars/step. Net: B=8 is 2.5x throughput vs B=16. LLRD
  # 3 epochs × 2636 steps × 6 s = 13 h/fold = 52 h for 4 folds.
  batch_size: 8
  num_workers: 0
  lookback_T: 64
  n_news_slots: 8
  label_mode: triple_barrier

ssl:
  epochs: 10
  mask_ratio: 0.40
  k_views: 3
  lambda_sim: 0.5
  lambda_clip: 0.5
  lambda_aecf: 1.0
  grad_clip_max_norm: 1.0
  log_every_n_steps: 100
  lr: 1e-4
  weight_decay: 0.1
  warmup_steps: 300

probe:
  epochs: 5
  lr: 1e-3
  grad_clip_max_norm: 1.0
  focal_gamma: 3.0

llrd:
  # 10 epochs × 2636 steps × ~6 s/step on shared GB10 = 44 h/fold = 7
  # days for 4 folds. Drop to 3 epochs: 13 h/fold = 2 days total. Still
  # enough to converge LLRD with Sharpe loss (Mac mini V2 used 5 epochs
  # via NANOGLD_LLRD_MAX_STEPS=3000 cap).
  epochs: 3
  base_lr: 1e-4
  decay: 0.85
  mixout_p: 0.7
  ema_decay: 0.999
  grad_clip_max_norm: 1.0
  focal_gamma: 3.0
  cost_bps: 2.0
  focal_weight: 0.5
  sharpe_weight: 0.5
  aecf_weight: 0.05
  freelb_K: 2
  freelb_epsilon: 0.5

calibration:
  alpha_target: 0.10
  raps_lambda: 0.01
  raps_kreg: 1
  t_scaling_max_iter: 50

walk_forward:
  n_folds: 4
  train_years: 3.0
  val_months: 6.0
  test_months: 6.0
  step_months: 3.0
  embargo_days: 7

reproducibility:
  seed: 42
  deterministic: true

ablations:
  # V4 = honest baseline (full architecture, all knobs active, WF splits)
  news_kill: false

observability:
  heartbeat_seconds: 30
  wandb_tags: ["v4", "wf-true", "spark", "gb10"]

paths:
  unified: data/processed/training_v1_unified.pt
  sidecar: data/processed/training_v1_sidecar.pt
  sidecar_template: "data/processed/training_v1_sidecar_fold_{fold}.pt"
  hmm: data/processed/v1_hmm.joblib
  output_dir: checkpoints/v4
  reports_dir: reports
